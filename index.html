<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Troubleshooting Data</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7f7;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wp-button {
      background: #2271b1;
      border: none;
      color: #fff;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.3s ease;
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px; /* För att undvika "hopp" */
    }

    .wp-button:hover:not(:disabled) {
      background: #135e96;
    }

    .wp-button:disabled {
      cursor: not-allowed;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3); /* grå ton */
      border-top: 2px solid #fff; /* vit snurrande del */
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.6s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .tooltip-wrapper {
      position: relative;
      display: inline-block;
      margin-left: 8px;
    }

    .tooltip-icon {
      background: #f0f0f1;
      color: #50575e;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 13px;
      cursor: default;
      border: 1px solid #c3c4c7;
      line-height: 1;
    }

    .tooltip-text {
      visibility: hidden;
      width: 250px;
      background-color: #23282d;
      color: #fff;
      text-align: left;
      border-radius: 4px;
      padding: 8px 10px;
      position: absolute;
      z-index: 1;
      top: -5px;
      left: 120%;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 13px;
    }

    .tooltip-wrapper:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <button class="wp-button" id="downloadBtn">
    <span class="spinner" id="spinner"></span>
    <span>Download troubleshooting data</span>
  </button>
  <div class="tooltip-wrapper">
    <span class="tooltip-icon">?</span>
    <div class="tooltip-text">
      Generates a file containing order data, system report, and log entries (if logging is enabled). Useful when contacting support. Logs are retained for 30 days by default.
    </div>
  </div>
</div>

<script>
  const button = document.getElementById("downloadBtn");
  const spinner = document.getElementById("spinner");

  button.addEventListener("click", function () {
    spinner.style.display = "inline-block";
    button.disabled = true;

    // Simulera genereringstid (t.ex. 3 sekunder)
    setTimeout(() => {
      spinner.style.display = "none";
      button.disabled = false;

      // Skapa och ladda ner fil
      const fileContent = "Här är din felsökningsdata...";
      const blob = new Blob([fileContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "troubleshooting-data.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 3000);
  });
</script>

</body>
</html>
